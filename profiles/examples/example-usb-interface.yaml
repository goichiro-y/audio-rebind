# Example profile for an AG03-class USB interface + one long-lived app.
# Schema: docs/specs/profile-spec.md
#
# Fill before run (copy to local/profiles/ first — do not commit personal paths):
# [ ] hardwareIdPatterns: replace XXXX/YYYY (HardwareId pattern only — not full InstanceId)
#     Guide: docs/guides/discover-hardware-id.md
# [ ] apps.processes[].path: your executable (or set apps.enabled: false)
# [ ] If USB disable fails on your PC: usbDevice.enabled: false
# [ ] Optional: windowAfterStart: minimize for background apps; lower gracefulStopSeconds for Electron
# Do not commit real InstanceIds, usernames, or machine-absolute personal paths into shared examples.

name: example-usb-interface
description: >
  Placeholder profile. Replace VID/PID and executable path before use.

steps:
  audioEngine:
    enabled: true
  usbDevice:
    enabled: true
    hardwareIdPatterns:
      # Replace XXXX/YYYY with HardwareId pattern (not full InstanceId).
      - "USB\\VID_XXXX&PID_YYYY"
    # If Disable-PnpDevice fails on your host, set enabled: false (see src/README Resume timing tips).
  apps:
    enabled: true
    # windowAfterStart: minimize   # or per process entry
    processes:
      # Prefer full path; name-only matching is allowed but weaker.
      - path: "C:\\Path\\To\\YourApp.exe"
        # name: "YourApp.exe"
        # windowAfterStart: minimize
    gracefulStopSeconds: 10
    forceStopSeconds: 5
    # Electron-style apps often need lower values (e.g. 2) — see src/README Resume timing tips / #13.

delays:
  afterAudioEngineMs: 2000  # try 500–1000 if endpoints settle fast (see src/README / #20)
  afterUsbDeviceMs: 2000
  afterAppsMs: 0
